[project]
name = "wyoming-mlx"
version = "0.1.0"
description = "Apple-Silicon-native TTS and STT for Home Assistant and OpenAI-compatible clients"
requires-python = ">=3.12"
dependencies = [
    "wyoming",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "numpy",
    "soundfile",
    "python-multipart>=0.0.29",
]

[project.scripts]
wyoming-mlx = "wyoming_mlx.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wyoming_mlx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring real MLX models (deselect with '-m \"not integration\")",
]
addopts = "-m 'not integration'"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.coverage.run]
source = ["src/wyoming_mlx"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.14",
]
